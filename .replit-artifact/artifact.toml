kind = "mobile"
previewPath = "/premium-blackjack/"
title = "Premium Blackjack"
description = "A realistic mobile Blackjack game for Expo Go with premium table styling, smooth card animations, flexible betting, rank progression, unlockable table themes, and persistent player statistics."
version = "1.0.0"
id = "artifacts/premium-blackjack"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/premium-blackjack/" ]
localPort = 21428

[services.development]
run = "pnpm --filter @workspace/premium-blackjack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/premium-blackjack", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/premium-blackjack", "run", "serve" ]

[services.env]
PORT = "21428"
BASE_PATH = "/premium-blackjack/"
